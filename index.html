<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Signal87 AI — Enterprise Document Memory &amp; Legal AI Research Platform</title>
    <meta name="description" content="Signal87 AI is an enterprise document memory and legal AI research platform. Upload contracts, reports, and spreadsheets, then ask questions in plain language and get answers with citations back to the exact page and paragraph in your own documents." />
    <link rel="canonical" href="https://signal87.ai/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installed-app identity. Without a manifest and a real PNG touch icon,
         adding this to a home screen produced a screenshot thumbnail and opened
         in a browser tab with its chrome intact. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <meta name="application-name" content="Signal87" />
    <meta name="apple-mobile-web-app-title" content="Signal87" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Translucent so the app's own background runs under the clock and
         battery, rather than iOS painting an opaque white strip above it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FAFAF9" />
    <meta name="color-scheme" content="light" />
    <!-- Phone numbers and dates in contract text are not links. -->
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Signal87 AI" />
    <meta property="og:url" content="https://signal87.ai/" />
    <meta property="og:title" content="Signal87 AI — Enterprise Document Memory &amp; Legal AI Research Platform" />
    <meta property="og:description" content="Upload contracts, reports, and spreadsheets, then ask questions in plain language and get answers with citations back to the exact page and paragraph in your own documents." />
    <meta property="og:image" content="https://signal87.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Signal87 AI — Enterprise Document Memory &amp; Legal AI Research Platform" />
    <meta name="twitter:description" content="Upload contracts, reports, and spreadsheets, then ask questions in plain language and get answers with citations back to the exact page and paragraph in your own documents." />
    <meta name="twitter:image" content="https://signal87.ai/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "@id": "https://signal87.ai/#app",
            "name": "Signal87 AI",
            "url": "https://signal87.ai/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Enterprise document memory and legal AI research platform. Upload contracts, reports, and spreadsheets, then ask questions in plain language and get answers with citations back to the exact page and paragraph in your own documents.",
            "publisher": { "@id": "https://signal87.ai/#organization" },
            "privacyPolicy": "https://signal87.ai/privacy",
            "termsOfService": "https://signal87.ai/terms"
          },
          {
            "@type": "Organization",
            "@id": "https://signal87.ai/#organization",
            "name": "Signal87 AI",
            "url": "https://signal87.ai/",
            "logo": "https://signal87.ai/favicon.svg",
            "founder": { "@id": "https://signal87.ai/#michael-benezra" }
          },
          {
            "@type": "Person",
            "@id": "https://signal87.ai/#michael-benezra",
            "name": "Michael Benezra",
            "jobTitle": "Chief Executive Officer & Co-Founder",
            "worksFor": { "@id": "https://signal87.ai/#organization" },
            "url": "https://signal87.ai/"
          }
        ]
      }
    </script>

    <!-- Inter, served from this origin. Previously two preconnects and a
         stylesheet request to Google before a single glyph could be drawn; on a
         phone that is a round trip to a third party on every cold start, and one
         a restrictive network can simply refuse. Preloaded so the font is in
         flight alongside the stylesheet rather than discovered after it. -->
    <link
      rel="preload"
      href="/fonts/inter-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/inter.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Signal87 AI</h1>
      <p>
        Signal87 AI is an enterprise document memory and legal AI research platform. Upload
        contracts, reports, and spreadsheets, then ask questions in plain language and get
        answers with citations back to the exact page and paragraph in your own documents.
      </p>
      <p>
        You can also connect Google Drive to import documents you already store there. Signal87 AI
        reads only the files you choose to import, and never uses your documents to train AI models.
      </p>
      <p>
        <a href="/privacy">Privacy Policy</a> &middot;
        <a href="/terms">Terms of Service</a>
      </p>
      <p>This application requires JavaScript to be enabled.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
