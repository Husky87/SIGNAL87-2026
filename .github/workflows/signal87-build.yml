name: Signal87 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused TypeScript check
        run: npx tsc -p tsconfig.ci.json --noEmit

      - name: AI fallback routing tests
        run: npm run test:ai-fallback

      - name: Firebase AI fallback routing tests
        run: npm run test:firebase-ai-fallback

      - name: Build
        run: npm run build
