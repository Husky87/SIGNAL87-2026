name: Signal87 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused TypeScript check
        run: npx tsc -p tsconfig.ci.json --noEmit

      - name: AI fallback routing tests
        run: npm run test:ai-fallback

      - name: Firebase AI fallback routing tests
        run: npm run test:firebase-ai-fallback

      - name: Build
        run: npm run build

      - name: Production API reachability smoke test
        run: |
          curl --fail --silent --show-error --location --max-time 20 https://signal87.ai/api/health

      - name: Research API authentication smoke test
        run: |
          status=$(curl --silent --show-error --location --max-time 20 --output /tmp/research-response.json --write-out '%{http_code}' \
            --request POST https://signal87.ai/api/research \
            --header 'Content-Type: application/json' \
            --data '{"researchGoal":"Unauthenticated smoke test"}')
          echo "Research API HTTP status: $status"
          cat /tmp/research-response.json
          test "$status" = "401"
